name: event-checkin-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventcheckin
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: eventcheckin
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventcheckin -d eventcheckin"]
      interval: 5s
      timeout: 3s
      retries: 10
  role-setup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: local_dev_only
    volumes:
      - ./ops/local_roles.sql:/roles.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "db", "-U", "eventcheckin", "-d", "eventcheckin", "-f", "/roles.sql"]
    depends_on:
      db:
        condition: service_healthy
  migrate:
    profiles: ["tools"]
    build: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://eventcheckin:local_dev_only@db:5432/eventcheckin
    command: ["alembic", "upgrade", "head"]
    depends_on:
      role-setup:
        condition: service_completed_successfully
  api:
    build: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://eventcheckin_app:local_app_only@db:5432/eventcheckin
      IDENTITY_DATABASE_URL: postgresql+psycopg://eventcheckin_identity_app:local_identity_only@db:5432/eventcheckin
      PLATFORM_DATABASE_URL: postgresql+psycopg://eventcheckin_platform_app:local_platform_only@db:5432/eventcheckin
      PLATFORM_HOST: platform.local.example.test
      FALLBACK_DOMAIN_SUFFIX: local.example.test
      INGRESS_PROXY_IPS: "127.0.0.1"
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      COMPROMISED_PASSWORD_CORPUS: ${COMPROMISED_PASSWORD_CORPUS:-}
      COMPROMISED_PASSWORD_SHA256: ${COMPROMISED_PASSWORD_SHA256:-}
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: "1025"
      EMAIL_FROM: staff@local.example.test
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      role-setup:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  object-storage:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: local_object_key
      RUSTFS_SECRET_KEY: local_object_secret_only
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_data_rustfs:/data
  object-storage-init:
    build: ./backend
    command: ["python", "-m", "app.worker.storage_bootstrap"]
    environment:
      APP_ENV: local
      STORAGE_ENDPOINT_URL: http://object-storage:9000
      STORAGE_BUCKET: eventcheckin-private
      STORAGE_ACCESS_KEY: local_object_key
      STORAGE_SECRET_KEY: local_object_secret_only
    depends_on:
      - object-storage
  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://eventcheckin_app:local_app_only@db:5432/eventcheckin
      JOBS_DATABASE_URL: postgresql+psycopg://eventcheckin_jobs_app:local_jobs_only@db:5432/eventcheckin
      DOMAIN_WORKER_DATABASE_URL: postgresql+psycopg://eventcheckin_domain_worker_app:local_domain_worker_only@db:5432/eventcheckin
      PLATFORM_HOST: platform.local.example.test
      FALLBACK_DOMAIN_SUFFIX: local.example.test
      REDIS_URL: redis://redis:6379/0
    depends_on:
      role-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  dispatcher:
    build: ./backend
    command: ["python", "-m", "app.worker.dispatcher"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://eventcheckin_app:local_app_only@db:5432/eventcheckin
      DISPATCHER_DATABASE_URL: postgresql+psycopg://eventcheckin_dispatcher_app:local_dispatcher_only@db:5432/eventcheckin
      REDIS_URL: redis://redis:6379/0
    depends_on:
      role-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  domain-maintenance:
    build: ./backend
    command: ["python", "-m", "app.tenancy.maintenance"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://eventcheckin_app:local_app_only@db:5432/eventcheckin
      DOMAIN_SCHEDULER_DATABASE_URL: postgresql+psycopg://eventcheckin_domain_scheduler_app:local_domain_scheduler_only@db:5432/eventcheckin
      PLATFORM_HOST: platform.local.example.test
      FALLBACK_DOMAIN_SUFFIX: local.example.test
    depends_on:
      role-setup:
        condition: service_completed_successfully
  storage-maintenance:
    build: ./backend
    command: ["python", "-m", "app.worker.storage_maintenance"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://eventcheckin_app:local_app_only@db:5432/eventcheckin
      JOBS_OPERATOR_DATABASE_URL: postgresql+psycopg://eventcheckin_job_operator_app:local_operator_only@db:5432/eventcheckin
      STORAGE_ENDPOINT_URL: http://object-storage:9000
      STORAGE_BUCKET: eventcheckin-private
      STORAGE_ACCESS_KEY: local_object_key
      STORAGE_SECRET_KEY: local_object_secret_only
    depends_on:
      role-setup:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  postgres_data:
  redis_data:
  object_data:
  object_data_rustfs:

