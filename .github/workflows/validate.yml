name: Validate foundation
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eventcheckin
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: eventcheckin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventcheckin -d eventcheckin_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://eventcheckin:ci_only@localhost:5432/eventcheckin_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://eventcheckin:ci_only@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/14
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_BUCKET: eventcheckin-ci-private
      TEST_S3_ACCESS_KEY: ci_object_key
      TEST_S3_SECRET_KEY: ci_object_secret_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
        working-directory: backend
      - name: Start private object storage for integration tests
        run: >-
          docker run -d --name eventcheckin-ci-object
          -p 127.0.0.1:9000:9000
          -e RUSTFS_ACCESS_KEY=ci_object_key
          -e RUSTFS_SECRET_KEY=ci_object_secret_only
          -e RUSTFS_ADDRESS=:9000
          -e RUSTFS_CONSOLE_ENABLE=false
          rustfs/rustfs:1.0.1 /data
      - name: Create private test bucket
        working-directory: backend
        env:
          STORAGE_ENDPOINT_URL: ${{ env.TEST_S3_ENDPOINT }}
          STORAGE_BUCKET: ${{ env.TEST_S3_BUCKET }}
          STORAGE_ACCESS_KEY: ${{ env.TEST_S3_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ env.TEST_S3_SECRET_KEY }}
        run: python -m app.worker.storage_bootstrap
      - run: ruff check .
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        working-directory: backend
      - run: python -c 'from fastapi.testclient import TestClient; from app.main import app; assert TestClient(app).get("/ready").status_code == 200'
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

